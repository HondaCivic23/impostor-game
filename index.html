<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#120c1f">
    <title>Impostor - Kim jest szpieg?</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #151022;
            --card-neutral-bg: linear-gradient(180deg, #6222cc 0%, #290c5c 100%);
            --primary-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --civilian-blue: #0ea5e9;
            --impostor-red: #ef4444;
            --text-light: #ffffff;
            --text-muted: #94a3b8;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: -webkit-fill-available;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: max(16px, var(--safe-top)) 16px max(16px, var(--safe-bottom)) 16px;
            max-width: 440px;
            margin: 0 auto;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .game-title {
            text-align: center;
            font-size: 2.1rem;
            font-weight: 900;
            background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 2px 0;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0 0 14px 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .input-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 2px solid rgba(139, 92, 246, 0.3);
            background-color: var(--panel-bg);
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 600;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-pink);
        }

        .btn {
            min-height: 54px;
            background: linear-gradient(135deg, var(--primary-purple) 0%, #6d28d9 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-add {
            width: auto;
            min-width: 58px;
            font-size: 1.5rem;
            padding: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
        }

        .players-scroll {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 2px;
        }

        #player-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #player-list li {
            background: var(--panel-bg);
            padding: 12px 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(139, 92, 246, 0.25);
            font-weight: 700;
        }

        #player-list li button {
            background: #ef4444;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
        }

        /* STYL WYNIKU JAK NA SCREENACH */
        .result-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 10px;
        }

        .role-icon-lg {
            font-size: 4rem;
            margin-bottom: 12px;
        }

        .role-title-styled {
            font-size: 2.3rem;
            font-weight: 900;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .role-title-styled.civilian {
            color: var(--civilian-blue);
        }

        .role-title-styled.impostor {
            color: var(--impostor-red);
        }

        .role-title-styled.mrwhite {
            color: var(--civilian-blue);
        }

        .role-desc-styled {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.4;
            max-width: 320px;
        }

        .role-desc-styled span {
            display: block;
            font-size: 1.8rem;
            font-weight: 900;
            margin-top: 6px;
            color: #ffffff;
        }

        /* KARTA I ROLETA */
        .card-view-container {
            position: relative;
            width: 100%;
            flex: 1;
            margin: 10px 0;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 2px solid rgba(139, 92, 246, 0.3);
        }

        .card-inner-content {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-neutral-bg);
        }

        .sliding-cover {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #6b21a8 0%, #3b0764 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            z-index: 10;
            touch-action: none;
            cursor: grab;
        }

        .cover-top-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.5px;
        }

        .cover-avatars-box {
            width: 100%;
            height: 220px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .swipe-hint-box {
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .arrow-anim {
            animation: floatUp 1.2s infinite ease-in-out;
            color: var(--accent-pink);
            font-size: 1.6rem;
        }

        @keyframes floatUp {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .starter-card {
            background: var(--panel-bg);
            border: 2px solid var(--primary-purple);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            margin: 20px 0;
        }

        .starter-name {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--accent-pink);
            margin-top: 10px;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            animation: fadeIn 0.2s ease;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="container">
            
            <!-- EKRAN 1: SETUP -->
            <div id="setup-screen" class="screen active">
                <div class="game-title">IMPOSTOR</div>
                <div class="subtitle">KIM JEST SZPIEG?</div>

                <div class="input-box">
                    <input type="text" id="player-input" placeholder="Wpisz imię gracza..." autocomplete="off">
                    <button class="btn btn-add" onclick="addPlayer()">+</button>
                </div>

                <div class="players-scroll">
                    <ul id="player-list"></ul>
                </div>

                <select id="category-select" style="margin-bottom:10px;"></select>

                <div style="display:flex; gap:10px; margin-bottom:12px;">
                    <select id="impostor-count">
                        <option value="1">1 Impostor</option>
                        <option value="2">2 Impostorów</option>
                    </select>
                    <select id="mrwhite-toggle">
                        <option value="0">Bez Mr White'a</option>
                        <option value="1">1x Mr White 🕵️‍♂️</option>
                    </select>
                </div>

                <button class="btn" onclick="startGame()">GRAJ TERAZ</button>
            </div>

            <!-- EKRAN 2: ODKRYWANIE KARTY -->
            <div id="reveal-screen" class="screen">
                <div style="text-align:center; margin-bottom: 4px;">
                    <div style="font-size:0.85rem; color:var(--text-muted); text-transform:uppercase;">Przekaż telefon dla:</div>
                    <div id="current-player-name" style="font-size:2rem; font-weight:900; color:var(--accent-pink);"></div>
                </div>

                <div class="card-view-container" id="card-container">
                    <!-- Wynik pod roletą -->
                    <div class="card-inner-content" id="card-inner">
                        <div class="result-view">
                            <div class="role-icon-lg" id="role-icon">👥</div>
                            <div class="role-title-styled" id="role-title">Cywil</div>
                            <div class="role-desc-styled" id="role-desc">
                                Twoje słowo to:
                                <span id="secret-value">"Loch"</span>
                            </div>
                        </div>
                    </div>

                    <!-- Roleta z postaciami i tekstem jak na zdjęciu -->
                    <div class="sliding-cover" id="sliding-cover">
                        <div class="cover-top-text">Gracz</div>
                        <div class="cover-avatars-box">
                            👥🕵️‍♂️
                        </div>
                        <div class="swipe-hint-box">
                            Przesuń, by odkryć słowo. Uważaj na Impostorów! 👀
                            <span class="arrow-anim">▲</span>
                        </div>
                    </div>
                </div>

                <button id="next-btn" class="btn" onclick="nextPlayer()" style="display:none; background: #10b981;">Następny gracz</button>
            </div>

            <!-- EKRAN 3: DYSKUSJA -->
            <div id="start-discussion-screen" class="screen">
                <div class="game-title">DYSKUSJA</div>
                <div class="subtitle">ZDEMASKUJCIE SZPIEGA!</div>

                <div class="starter-card">
                    <div style="font-size:0.9rem; color:var(--text-muted); font-weight:700;">ZACZYNA:</div>
                    <div id="starter-player-name" class="starter-name">---</div>
                </div>

                <p style="text-align:center; color:var(--text-muted); font-size:0.95rem; line-height:1.5;">
                    Przekaż urządzenie następnemu graczowi.
                </p>

                <div style="margin-top:auto;">
                    <button class="btn" onclick="replaysameGame()" style="margin-bottom:10px;">ZAGRAJ PONOWNIE</button>
                    <button class="btn" onclick="resetGame()" style="background:#374151;">MENU GŁÓWNE</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const categories = {
            "all": { name: "🎲 Wszystkie pakiety (Miks)", pairs: [] },
            "food": {
                name: "🍕 Jedzenie & Napoje",
                pairs: [
                    { word: "Pizza", clue: "Trójkąt" },
                    { word: "Burger", clue: "Warstwy" },
                    { word: "Lody", clue: "Wafelek" },
                    { word: "Kawa", clue: "Kofeina" },
                    { word: "Czekolada", clue: "Kostka" },
                    { word: "Sushi", clue: "Rulon" },
                    { word: "Frytki", clue: "Sól" },
                    { word: "Herbata", clue: "Liście" },
                    { word: "Kebab", clue: "Baranina" },
                    { word: "Cytryna", clue: "Kwas" },
                    { word: "Popcorn", clue: "Seans" },
                    { word: "Pączek", clue: "Lukier" }
                ]
            },
            "places": {
                name: "📍 Miejsca i Lokacje",
                pairs: [
                    { word: "Plaża", clue: "Mewy" },
                    { word: "Szkoła", clue: "Korytarz" },
                    { word: "Samolot", clue: "Okienko" },
                    { word: "Kawiarnia", clue: "Aromat" },
                    { word: "Szpital", clue: "Oddział" },
                    { word: "Restauracja", clue: "Rachunek" },
                    { word: "Siłownia", clue: "Lustra" },
                    { word: "Kino", clue: "Ciemność" },
                    { word: "Basen", clue: "Kafelki" },
                    { word: "Biblioteka", clue: "Cisza" },
                    { word: "Muzeum", clue: "Gablota" }
                ]
            },
            "objects": {
                name: "📦 Przedmioty & Gadżety",
                pairs: [
                    { word: "Smartfon", clue: "Szybka" },
                    { word: "Zegarek", clue: "Wskazówka" },
                    { word: "Samochód", clue: "Klakson" },
                    { word: "Rower", clue: "Łańcuch" },
                    { word: "Lustro", clue: "Szkło" },
                    { word: "Parasol", clue: "Krople" },
                    { word: "Okulary", clue: "Oprawka" },
                    { word: "Aparat", clue: "Błysk" }
                ]
            },
            "popculture": {
                name: "🎬 Popkultura & Filmy",
                pairs: [
                    { word: "Batman", clue: "Jaskinia" },
                    { word: "Harry Potter", clue: "Blizna" },
                    { word: "Shrek", clue: "Cebula" },
                    { word: "Spider-Man", clue: "Siatka" },
                    { word: "Darth Vader", clue: "Oddech" },
                    { word: "Titanic", clue: "Kataklizm" },
                    { word: "Barbie", clue: "Plastik" },
                    { word: "Minecraft", clue: "Kwadrat" }
                ]
            }
        };

        Object.keys(categories).forEach(k => {
            if (k !== "all") categories.all.pairs.push(...categories[k].pairs);
        });

        let players = [];
        let gameData = [];
        let currentIndex = 0;

        function getUsedWords(catKey) {
            try { return JSON.parse(localStorage.getItem("imp_used_" + catKey)) || []; } catch(e) { return []; }
        }
        function markUsed(catKey, word) {
            try {
                let u = getUsedWords(catKey);
                if (!u.includes(word)) { u.push(word); localStorage.setItem("imp_used_" + catKey, JSON.stringify(u)); }
            } catch(e) {}
        }
        function getUnusedRandomPair(catKey) {
            let pool = categories[catKey].pairs;
            let used = getUsedWords(catKey);
            let available = pool.filter(p => !used.includes(p.word));
            if (available.length === 0) {
                localStorage.removeItem("imp_used_" + catKey);
                available = pool;
            }
            let chosen = available[Math.floor(Math.random() * available.length)];
            markUsed(catKey, chosen.word);
            return chosen;
        }

        window.onload = () => {
            const select = document.getElementById("category-select");
            Object.keys(categories).forEach(k => {
                const opt = document.createElement("option");
                opt.value = k; opt.textContent = categories[k].name;
                select.appendChild(opt);
            });
            updatePlayerList();
            document.getElementById("player-input").addEventListener("keypress", (e) => {
                if (e.key === "Enter") addPlayer();
            });
        };

        function addPlayer() {
            const inp = document.getElementById("player-input");
            const val = inp.value.trim();
            if (val && !players.includes(val)) {
                players.push(val);
                inp.value = "";
                updatePlayerList();
            }
        }

        function removePlayer(i) {
            players.splice(i, 1);
            updatePlayerList();
        }

        function updatePlayerList() {
            const ul = document.getElementById("player-list");
            ul.innerHTML = players.length === 0 ? `<li style="justify-content:center; color:var(--text-muted);">Brak graczy. Dodaj imiona wyżej!</li>` : "";
            players.forEach((p, idx) => {
                ul.innerHTML += `<li><span>${p}</span><button onclick="removePlayer(${idx})">✕</button></li>`;
            });
        }

        function startGame() {
            if (players.length < 3) { alert("Wpisz co najmniej 3 graczy!"); return; }
            const impCount = parseInt(document.getElementById("impostor-count").value);
            const hasMrWhite = parseInt(document.getElementById("mrwhite-toggle").value) === 1;

            if (impCount + (hasMrWhite ? 1 : 0) >= players.length) {
                alert("Za dużo ról w stosunku do liczby graczy!"); return;
            }

            const catKey = document.getElementById("category-select").value;
            const pair = getUnusedRandomPair(catKey);

            let roles = [];
            for (let i = 0; i < impCount; i++) roles.push("impostor");
            if (hasMrWhite) roles.push("mrwhite");
            while (roles.length < players.length) roles.push("civilian");

            roles.sort(() => Math.random() - 0.5);

            gameData = players.map((p, idx) => {
                let role = roles[idx];
                return {
                    name: p,
                    role: role,
                    pair: pair
                };
            });

            currentIndex = 0;
            showScreen('reveal-screen');
            loadPlayerTurn();
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function loadPlayerTurn() {
            const data = gameData[currentIndex];
            document.getElementById("current-player-name").innerText = data.name;

            const iconEl = document.getElementById("role-icon");
            const titleEl = document.getElementById("role-title");
            const descEl = document.getElementById("role-desc");

            titleEl.className = "role-title-styled";

            if (data.role === "civilian") {
                iconEl.innerText = "👥";
                titleEl.innerText = "Cywil";
                titleEl.classList.add("civilian");
                descEl.innerHTML = `Twoje słowo to:<span>"${data.pair.word}"</span>`;
            } else if (data.role === "impostor") {
                iconEl.innerText = "🕵️‍♂️";
                titleEl.innerText = "Impostor";
                titleEl.classList.add("impostor");
                descEl.innerHTML = `Twoja wskazówka to:<span>"${data.pair.clue}"</span>`;
            } else if (data.role === "mrwhite") {
                iconEl.innerText = "🕵️‍♂️";
                titleEl.innerText = "Mr White";
                titleEl.classList.add("mrwhite");
                descEl.innerHTML = `<span>Nie masz żadnego słowa! Blefuj!</span>`;
            }

            resetCover();
            document.getElementById("next-btn").style.display = "none";
        }

        function nextPlayer() {
            currentIndex++;
            if (currentIndex < players.length) {
                loadPlayerTurn();
            } else {
                const starter = players[Math.floor(Math.random() * players.length)];
                document.getElementById("starter-player-name").innerText = starter;
                showScreen('start-discussion-screen');
            }
        }

        function replaysameGame() { startGame(); }
        function resetGame() { showScreen('setup-screen'); }

        const cover = document.getElementById("sliding-cover");
        const cardContainer = document.getElementById("card-container");
        let startY = 0, currentY = 0, isDragging = false;

        function getClientY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

        function onStart(e) {
            isDragging = true;
            startY = getClientY(e);
            cover.style.transition = 'none';
        }

        function onMove(e) {
            if (!isDragging) return;
            let delta = getClientY(e) - startY;
            if (delta <= 0) {
                currentY = Math.max(delta, -cardContainer.clientHeight);
                cover.style.transform = `translateY(${currentY}px)`;
            }
        }

        function onEnd() {
            if (!isDragging) return;
            isDragging = false;
            cover.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
            if (currentY < -(cardContainer.clientHeight * 0.35)) {
                cover.style.transform = `translateY(-100%)`;
                document.getElementById("next-btn").style.display = "block";
            } else {
                resetCover();
            }
        }

        function resetCover() {
            cover.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
            cover.style.transform = `translateY(0)`;
            currentY = 0;
        }

        cover.addEventListener('touchstart', onStart, {passive:true});
        window.addEventListener('touchmove', onMove, {passive:true});
        window.addEventListener('touchend', onEnd);
        cover.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
    </script>
</body>
</html>
